<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный тренажер Пчелка</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>

    
    <div class="grid-container">  
        
        <header id="header-content"></header>

        <div class="activity-bar" id="activity-bar">
            <button class="activity-button active" id="activity-btn-simulation" data-content="simulation">
                <img src="src/assets/icon/drone.svg" alt="Режим полета" class="icon">
            </button>
            <button class="activity-button" id="activity-btn-settings" data-content="settings">
                <img src="src/assets/icon/sliders-horizontal.svg" alt="Настройки" class="icon">
            </button>
            <button class="activity-button" id="activity-btn-education" data-content="education">
                <img src="src/assets/icon/student.svg" alt="Обучение" class="icon">
            </button>
            <button class="activity-button" id="activity-btn-flying" data-content="flying">
                <img src="src/assets/icon/game-controller.svg" alt="Полет" class="icon">
            </button>
        </div>

        <div class="sidebar-left" id="sidebar-left">
            
            <div class="accordion accordion-flush" id="accordion-settings" data-content="simulation">
                <div id="controls">    
                    <div class="control-group">
                        <div class="simulation-controls">
                            <label>
                                Длительность (сек):
                                <input class="input-settings" type="number" id="animationDuration" min="0.1" max="10" step="0.1" value="1">
                            </label>
                        </div>
                        <div class="simulation-controls">
                            <label>
                                Пауза (сек):
                                <input class="input-settings" type="number" id="animationPause" min="0.1" max="10" step="0.1" value="1">
                            </label>
                        </div>
                        <div class="d-grid gap-1">
                            <button type="button" class="btn btn-primary" id="flight-simulator-btn">Запустить симулятор полета</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="accordion accordion-flush" id="accordion-settings" data-content="settings">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                        Камера
                    </button>
                    </h2>
                    <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                        <div class="accordion-body">
                            <div class="control-group">
                                <p>Положение камеры</p>
                                <div class="slider-container">
                                    <label>X:</label>
                                    <input type="range" id="cam-x" min="-20" max="20" step="0.1" value="0">
                                    <span id="cam-x-value">0</span>
                                </div>
                                <div class="slider-container">
                                    <label>Y:</label>
                                    <input type="range" id="cam-y" min="-20" max="20" step="0.1" value="1">
                                    <span id="cam-y-value">1</span>
                                </div>
                                <div class="slider-container">
                                    <label>Z:</label>
                                    <input type="range" id="cam-z" min="-20" max="20" step="0.1" value="3">
                                    <span id="cam-z-value">3</span>
                                </div>
                            </div>

                            <div class="control-group">
                                <p>Вращение камеры</p>
                                <div class="slider-container">
                                    <label>X:</label>
                                    <input type="range" id="cam-rot-x" min="-3.14" max="3.14" step="0.01" value="0">
                                    <span id="cam-rot-x-value">0</span>
                                </div>
                                <div class="slider-container">
                                    <label>Y:</label>
                                    <input type="range" id="cam-rot-y" min="-3.14" max="3.14" step="0.01" value="0">
                                    <span id="cam-rot-y-value">0</span>
                                </div>
                                <div class="slider-container">
                                    <label>Z:</label>
                                    <input type="range" id="cam-rot-z" min="-3.14" max="3.14" step="0.01" value="0">
                                    <span id="cam-rot-z-value">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false" aria-controls="flush-collapseTwo">
                        Свет
                    </button>
                    </h2>
                    <div id="flush-collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                        <div class="accordion-body">
                            <div class="control-group">
                                <p>Источник света</p>
                                <div class="slider-container">
                                    <label>X:</label>
                                    <input type="range" id="light-x" min="-20" max="10" step="0.1" value="1">
                                    <span id="light-x-value">1</span>
                                </div>
                                <div class="slider-container">
                                    <label>Y:</label>
                                    <input type="range" id="light-y" min="-20" max="10" step="0.1" value="1">
                                    <span id="light-y-value">1</span>
                                </div>
                                <div class="slider-container">
                                    <label>Z:</label>
                                    <input type="range" id="light-z" min="-20" max="10" step="0.1" value="1">
                                    <span id="light-z-value">1</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="accordion accordion-flush" id="accordion-settings" data-content="education">
                <div class="add-lesson-group">
                    <div id="lessons-list"></div>
                    <button id="add-lesson-btn" class="btn btn-primary">Редактировать курс</button>
                    <button id="export-btn" class="btn btn-secondary">Экспорт курса</button>
                    <button id="import-btn" class="btn btn-secondary">Импорт курса</button>
                </div>
            </div>
            <div class="accordion accordion-flush" id="accordion-settings" data-content="flying">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseFlOne" aria-expanded="false" aria-controls="flush-collapseFlOne">
                        Полет кнопка 1
                    </button>
                    </h2>
                    <div id="flush-collapseFlOne" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                        <div class="accordion-body">
                            <p>Полет содержимое 1</p>
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseFlTwo" aria-expanded="false" aria-controls="flush-collapseFlTwo">
                        Полет кнопка 2
                    </button>
                    </h2>
                    <div id="flush-collapseFlTwo" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                        <div class="accordion-body">
                            <p>Полет содержимое 2</p>
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseFlThree" aria-expanded="false" aria-controls="flush-collapseFlThree">
                        Полет кнопка 3
                    </button>
                    </h2>
                    <div id="flush-collapseFlThree" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                        <div class="accordion-body">
                            <p>Полет содержимое 3</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-content" id="main-content">   
            <div id="drone-container">   
            </div>

            <!-- Модальное окно редактора -->
            <div id="editor-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h3>Редактор урока</h3>
                    <input type="text" id="lesson-title-input" placeholder="Название урока">
                    <textarea id="lesson-content-input" placeholder="Содержание урока"></textarea>
                    <button id="save-lesson-btn">Сохранить</button>
                    <button id="cancel-editor-btn">Отмена</button>
                </div>
            </div>

            <!-- Контент для обучения -->
            <div id="education-content" style="display: none;">
                <h2 id="lesson-title"></h2>
                <div id="lesson-content"></div>
            </div>
        </div>
        
        <div class="sidebar-right" id="sidebar-right">
            <div class="toggle-switch d-none">
                <label style="min-width: 80px;">Режим:</label>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider"></span>
                </label>
                <span id="mode-text">Авто</span>
            </div>

            <div class="control-group d-none">
                <div class="toggle-switch">
                    <label style="min-width: 80px;">Обучение:</label>
                    <label class="switch">
                        <input type="checkbox" id="split-model-toggle">
                        <span class="slider"></span>
                    </label>
                    <span id="split-model-text">Выкл</span>
                </div>
            </div>

            <div id="learning-content-button" style="display: none; align-items: center;">
                <button id="back-to-3d" style="                    
                display: block;       
                margin: 0 auto;       
                padding: 8px 15px;    
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                min-width: 268px;"
                >Назад к 3D модели</button>
            </div>
            
            <div id="drone-parts">
            </div>

            <div class="control-group" id="drone-orientation">
                <p>Ориентация дрона</p>
                <div class="slider-container" id="roll-slider">
                    <label>Крен:</label>
                    <input type="range" id="roll-control" min="-180" max="180" step="1" value="0" disabled>
                    <span id="roll-value">0°</span>
                </div>
                <div class="slider-container" id="pitch-slider">
                    <label>Тангаж:</label>
                    <input type="range" id="pitch-control" min="-180" max="180" step="1" value="0">
                    <span id="pitch-value">0°</span>
                </div>
                <div class="slider-container" id="yaw-slider">
                    <label>Рыскание:</label>
                    <input type="range" id="yaw-control" min="-180" max="180" step="1" value="0">
                    <span id="yaw-value">0°</span>
                </div>
            </div>
            
            <div class="control-group d-none">
                <h3>Скорость вращения лопастей</h3>
                <div class="slider-container">
                    <label>Скорость:</label>
                    <input type="range" id="propeller-speed" min="0" max="100" step="1" value="0">
                    <span id="propeller-speed-value">0%</span>
                </div>
            </div>
            
            <div id="controls">
                <div class="control-save-settings d-none">
                    <h3>Сохранение настроек</h3>
                    <button id="save-settings">Сохранить</button>
                    <button id="load-settings">Загрузить</button>
                </div>
            </div>
        </div>

        <div class="info" id="info">
            <p>info1</p>    
        </div>      

        <footer>
            <p>footer</p>
        </footer>
    <script src="/src/renderer.js" type="module"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
